name: "HA Connect"
version: "0.3.1"
slug: ha_connect
description: >-
  Remote-Zugang zu Home Assistant ohne Portfreigabe.
  Pairing-Code vom HA-Connect-Dashboard eingeben – fertig.
url: "https://github.com/projex-aris/ha-connect-addon"
arch:
  - amd64
  - aarch64
  - armv7
# Prebuilt multi-arch image – Pi muss nicht lokal bauen
image: "ghcr.io/projex-aris/ha-connect-addon"
init: false
startup: services
boot: auto
homeassistant_api: true
hassio_api: true
apparmor: true
options:
  api_base: "https://ha-connect.com"
  pairing_code: ""
  local_host: "homeassistant"
  local_port: 8123
  heartbeat_interval: 30
  set_external_url: true
  reset_pairing: false
schema:
  api_base: str
  pairing_code: str?
  local_host: str
  local_port: int(1,65535)
  heartbeat_interval: int(10,300)
  set_external_url: bool
  reset_pairing: bool
map:
  - type: homeassistant_config
    read_only: false
services: []
